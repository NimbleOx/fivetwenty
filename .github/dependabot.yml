version: 2
updates:
  # Runtime + dev dependencies. Grouped so a routine refresh is one reviewable
  # PR instead of ~20; majors stay separate because they have historically
  # needed hands-on work (formatter reflows, renamed rules, moved APIs).
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      runtime:
        patterns:
          - "httpx"
          - "pydantic*"
        update-types:
          - "minor"
          - "patch"
      dev-tooling:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
