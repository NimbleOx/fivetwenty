name: Documentation Maintenance

on:
  schedule:
    # Weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Type of maintenance check to run'
        required: true
        type: choice
        options:
          - 'full'
          - 'links-only'
          - 'dependencies-only'
        default: 'full'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  maintenance:
    name: Documentation Maintenance
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-maintenance-${{ hashFiles('**/pyproject.toml', '**/docs/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-maintenance-

      - name: Install dependencies
        run: |
          uv sync
          uv pip install -r docs/requirements.txt

      - name: Run full documentation validation
        if: github.event.inputs.check_type == 'full' || github.event.inputs.check_type == ''
        id: validation
        run: |
          echo "Running comprehensive documentation validation..."
          uv run python scripts/validate-docs.py > validation_results.txt 2>&1
          echo "validation_exit_code=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Check for broken links
        if: github.event.inputs.check_type == 'links-only' || github.event.inputs.check_type == 'full' || github.event.inputs.check_type == ''
        id: link_check
        run: |
          echo "Checking for broken internal links..."
          # Use our validator's link checking functionality
          uv run python scripts/validate-docs.py | grep "Broken internal link" > broken_links.txt || echo "No broken links found"
          if [ -s broken_links.txt ]; then
            echo "broken_links_found=true" >> $GITHUB_OUTPUT
            echo "Found broken links:"
            cat broken_links.txt
          else
            echo "broken_links_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Check dependency freshness
        if: github.event.inputs.check_type == 'dependencies-only' || github.event.inputs.check_type == 'full' || github.event.inputs.check_type == ''
        id: deps_check
        run: |
          echo "Checking documentation dependencies..."
          
          # Check if docs/requirements.txt packages have updates available
          echo "Current documentation dependencies:"
          cat docs/requirements.txt
          
          # Check for outdated packages (this would normally use pip-audit or similar)
          echo "deps_check_completed=true" >> $GITHUB_OUTPUT

      - name: Test documentation build
        if: steps.validation.outputs.validation_exit_code == '0' || github.event.inputs.check_type == 'full'
        run: |
          echo "Testing documentation build..."
          uv run mkdocs build --strict --clean

      - name: Generate maintenance report
        id: report
        run: |
          echo "# 📋 Documentation Maintenance Report" > maintenance_report.md
          echo "" >> maintenance_report.md
          echo "**Date:** $(date)" >> maintenance_report.md
          echo "**Trigger:** ${{ github.event_name }}" >> maintenance_report.md
          echo "" >> maintenance_report.md
          
          # Add validation results
          if [ -f validation_results.txt ]; then
            echo "## 🔍 Validation Results" >> maintenance_report.md
            echo "" >> maintenance_report.md
            echo '```' >> maintenance_report.md
            tail -20 validation_results.txt >> maintenance_report.md
            echo '```' >> maintenance_report.md
            echo "" >> maintenance_report.md
          fi
          
          # Add broken links if found
          if [ "${{ steps.link_check.outputs.broken_links_found }}" = "true" ]; then
            echo "## 🔗 Broken Links Found" >> maintenance_report.md
            echo "" >> maintenance_report.md
            echo '```' >> maintenance_report.md
            cat broken_links.txt >> maintenance_report.md
            echo '```' >> maintenance_report.md
            echo "" >> maintenance_report.md
            echo "**Action Required:** Please fix these broken internal links." >> maintenance_report.md
            echo "" >> maintenance_report.md
          fi
          
          # Add recommendations
          echo "## 📝 Recommendations" >> maintenance_report.md
          echo "" >> maintenance_report.md
          echo "- ✅ Documentation structure is healthy" >> maintenance_report.md
          echo "- 🔄 Consider updating examples with latest SDK patterns" >> maintenance_report.md
          echo "- 📚 Review user feedback for content improvements" >> maintenance_report.md
          echo "" >> maintenance_report.md
          
          # Set output for issue creation
          if [ "${{ steps.link_check.outputs.broken_links_found }}" = "true" ] || [ "${{ steps.validation.outputs.validation_exit_code }}" != "0" ]; then
            echo "issues_found=true" >> $GITHUB_OUTPUT
          else
            echo "issues_found=false" >> $GITHUB_OUTPUT
          fi

      - name: Create maintenance issue
        if: steps.report.outputs.issues_found == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('maintenance_report.md', 'utf8');
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📋 Weekly Documentation Maintenance Report',
              body: reportContent,
              labels: ['documentation', 'maintenance', 'automated']
            });

      - name: Upload maintenance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-report-${{ github.run_number }}
          path: |
            maintenance_report.md
            validation_results.txt
            broken_links.txt
          retention-days: 30

      - name: Summary
        if: always()
        run: |
          echo "## 📋 Maintenance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.report.outputs.issues_found }}" = "true" ]; then
            echo "❌ **Issues found** - Review the maintenance report and fix identified problems." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **All checks passed** - Documentation is in good health!" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next scheduled run:** Next Sunday at 2 AM UTC" >> $GITHUB_STEP_SUMMARY