name: Documentation Maintenance

on:
  schedule:
    # Weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      check_type:
        description: 'Type of maintenance check to run'
        required: true
        type: choice
        options:
          - 'full'
          - 'files-only'
        default: 'full'

permissions:
  contents: read
  issues: write

jobs:
  maintenance:
    name: Documentation Maintenance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/uv
            .venv
          key: ${{ runner.os }}-maintenance-${{ hashFiles('**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-maintenance-

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run documentation file validation
        id: validation
        run: |
          set +e
          uv run poe docs-validate-files > validation_results.txt 2>&1
          echo "validation_exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -30 validation_results.txt

      - name: Run OANDA parity validation (live refresh)
        id: parity
        if: github.event.inputs.check_type != 'files-only'
        run: |
          set +e
          uv run poe docs-validate-parity-refresh > parity_results.txt 2>&1
          echo "parity_exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -30 parity_results.txt

      - name: Test documentation build
        id: build
        run: |
          set +e
          uv run mkdocs build --strict --clean > build_results.txt 2>&1
          echo "build_exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -10 build_results.txt

      - name: Generate maintenance report
        id: report
        run: |
          {
            echo "# 📋 Documentation Maintenance Report"
            echo ""
            echo "**Date:** $(date)"
            echo "**Trigger:** ${{ github.event_name }}"
            echo ""
            echo "| Check | Exit code |"
            echo "|---|---|"
            echo "| File validation | ${{ steps.validation.outputs.validation_exit_code }} |"
            echo "| OANDA parity (refresh) | ${{ steps.parity.outputs.parity_exit_code || 'skipped' }} |"
            echo "| Strict docs build | ${{ steps.build.outputs.build_exit_code }} |"
            echo ""
          } > maintenance_report.md
          for f in validation_results.txt parity_results.txt build_results.txt; do
            if [ -f "$f" ]; then
              {
                echo "## $f (tail)"
                echo '```'
                tail -25 "$f"
                echo '```'
                echo ""
              } >> maintenance_report.md
            fi
          done
          if [ "${{ steps.validation.outputs.validation_exit_code }}" != "0" ] || \
             [ "${{ steps.build.outputs.build_exit_code }}" != "0" ] || \
             { [ -n "${{ steps.parity.outputs.parity_exit_code }}" ] && \
               [ "${{ steps.parity.outputs.parity_exit_code }}" != "0" ]; }; then
            echo "issues_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "issues_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create maintenance issue
        if: steps.report.outputs.issues_found == 'true' && github.event_name == 'schedule'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const reportContent = fs.readFileSync('maintenance_report.md', 'utf8');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '📋 Weekly Documentation Maintenance Report',
              body: reportContent,
              labels: ['documentation', 'maintenance', 'automated']
            });

      - name: Upload maintenance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-report-${{ github.run_number }}
          path: |
            maintenance_report.md
            validation_results.txt
            parity_results.txt
            build_results.txt
          retention-days: 30

      - name: Fail on issues
        if: steps.report.outputs.issues_found == 'true'
        run: |
          echo "Maintenance checks found issues — see the report artifact." >&2
          exit 1
