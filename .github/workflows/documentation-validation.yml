name: Documentation Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'fivetwenty/**'
      - 'scripts/validation/**'
      - 'pyproject.toml'
      - '.github/workflows/documentation-validation.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'docs/**'
      - 'fivetwenty/**'
      - 'scripts/validation/**'
      - 'pyproject.toml'

jobs:
  validate-documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install toml

      - name: Run Phase 1-3 Validations
        run: |
          echo "🔍 Running core validation suite..."
          uv run python scripts/validation/validate_models.py
          uv run python scripts/validation/validate_code_examples.py
          uv run python scripts/validation/validate_links.py
          uv run python scripts/validation/validate_build.py
          uv run python scripts/validation/validate_markdown_style.py
          uv run python scripts/validation/validate_cross_document_consistency.py
          uv run python scripts/validation/validate_security_compliance.py

      - name: Run Phase 4 Validations
        run: |
          echo "🚀 Running Phase 4 validation suite..."
          uv run python scripts/validation/validate_endpoint_coverage.py
          uv run python scripts/validation/validate_version_consistency.py

      - name: Run Comprehensive Validation
        run: |
          echo "📊 Running comprehensive validation report..."
          uv run python scripts/validation/run_all_validations.py

      - name: Check Validation Results
        run: |
          echo "✅ Checking validation results..."
          python scripts/validation/check_validation_thresholds.py

      - name: Upload Validation Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: validation-reports
          path: docs/validation/reports/
          retention-days: 30

      - name: Comment PR with Validation Summary
        uses: actions/github-script@v6
        if: github.event_name == 'pull_request' && always()
        with:
          script: |
            const fs = require('fs');
            const path = 'docs/validation/reports/comprehensive_validation_report_executive_summary.md';

            if (fs.existsSync(path)) {
              const summary = fs.readFileSync(path, 'utf8');

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 📊 Documentation Validation Results\n\n${summary}`
              });
            }

  validate-automation:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Install dependencies
        run: |
          uv sync --all-extras
          uv pip install toml

      - name: Test Automated Fixes (Dry Run)
        run: |
          echo "🤖 Testing automated issue resolution..."
          uv run python scripts/validation/autofix_terminology.py
          uv run python scripts/validation/autofix_security_issues.py
          uv run python scripts/validation/autofix_all_issues.py

      - name: Upload Automation Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: automation-reports
          path: docs/validation/reports/*autofix*
          retention-days: 7

  quality-gates:
    runs-on: ubuntu-latest
    needs: [validate-documentation]
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validation reports
        uses: actions/download-artifact@v3
        with:
          name: validation-reports
          path: docs/validation/reports/

      - name: Check Quality Gates
        run: |
          echo "🚪 Checking quality gates..."
          python scripts/validation/check_quality_gates.py

      - name: Set job status
        run: |
          if [ -f "docs/validation/reports/quality_gate_status.txt" ]; then
            status=$(cat docs/validation/reports/quality_gate_status.txt)
            if [ "$status" = "FAILED" ]; then
              echo "❌ Quality gates failed"
              exit 1
            else
              echo "✅ Quality gates passed"
            fi
          else
            echo "⚠️ Quality gate status unknown"
            exit 1
          fi
