# Documentation Quality Pre-commit Hooks
repos:
  - repo: local
    hooks:
      - id: docs-validation-all
        name: Documentation Validation (All Checks)
        entry: bash -c 'cd docs-tooling/validation && uv run python cli.py run'
        language: system
        files: \.(md|py)$
        pass_filenames: false

      - id: docs-syntax-check
        name: Documentation Syntax Check
        entry: bash -c 'cd docs-tooling/validation && uv run python cli.py run syntax'
        language: system
        files: \.md$
        pass_filenames: false

      - id: docs-link-validation
        name: Documentation Link Validation
        entry: bash -c 'cd docs-tooling/validation && uv run python cli.py run links'
        language: system
        files: \.md$
        pass_filenames: false

      - id: docs-security-scan
        name: Documentation Security Scan
        entry: bash -c 'cd docs-tooling/validation && uv run python cli.py run security'
        language: system
        files: \.(md|py)$
        pass_filenames: false

      - id: docs-terminology-check
        name: Documentation Terminology Check
        entry: bash -c 'cd docs-tooling/validation && uv run python cli.py run terminology'
        language: system
        files: \.md$
        pass_filenames: false

      - id: docs-prose-check
        name: Documentation Prose Quality Check
        entry: bash -c 'cd docs-tooling/validation && uv run python cli.py run prose'
        language: system
        files: \.md$
        pass_filenames: false
