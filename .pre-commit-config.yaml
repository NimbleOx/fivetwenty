repos:
  - repo: local
    hooks:
      - id: validate-sdk-methods
        name: Validate SDK Method Names
        entry: uv run python docs-tooling/validation/hooks/check_sdk_methods.py
        language: system
        files: '\.(md)$'
        pass_filenames: false
        description: 'Validates that documentation uses current SDK method names'

      - id: validate-docs-syntax
        name: Validate Documentation Syntax
        entry: uv run python docs-tooling/validation/cli.py run syntax
        language: system
        files: '\.(md)$'
        pass_filenames: false
        description: 'Validates markdown syntax in documentation'

      - id: scan-docs-security
        name: Scan Documentation Security
        entry: uv run python docs-tooling/validation/cli.py run security
        language: system
        files: '\.(md)$'
        pass_filenames: false
        description: 'Scans documentation for potential security issues'

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        files: '\.(md)$'
      - id: end-of-file-fixer
        files: '\.(md)$'
      - id: check-yaml
        files: '\.(yml|yaml)$'