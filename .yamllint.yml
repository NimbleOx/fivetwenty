---
extends: default

rules:
  # Allow longer lines for documentation and API specs
  line-length:
    max: 120
    level: warning

  # Allow document start (---) to be omitted
  document-start: disable

  # Enforce consistent indentation
  indentation:
    spaces: 2
    indent-sequences: true

  # Allow truthy values like "on", "off" which are common in GitHub workflows
  truthy:
    allowed-values: ['true', 'false', 'TRUE', 'FALSE', 'on', 'off', 'ON', 'OFF']
    level: error

  # Keep comments-indentation enabled (enforces consistent comment indentation)
  # but disable other comment checks
  comments:
    min-spaces-from-content: 1
  comments-indentation: enable

  # Allow various quote styles
  quoted-strings: disable

  # Require new line at end of file
  new-line-at-end-of-file: enable

  # Enforce trailing spaces removal
  trailing-spaces: enable