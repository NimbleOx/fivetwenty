# Validation Configuration for FiveTwenty Documentation
# This file defines validation profiles, quality gates, and reporting settings

default_profile: "fivetwenty"

profiles:
  # FiveTwenty-specific profile
  fivetwenty:
    description: "Comprehensive validation for FiveTwenty documentation"
    file_patterns:
      - "docs/**/*.md"
      - "**/*.py"
      - "*.md"
    exclude_paths:
      - "validation_reports/**"
      - "node_modules/**"
      - ".git/**"
      - ".mypy_cache/**"
      - "__pycache__/**"
      - ".ruff_cache/**"
      - ".pytest_cache/**"
      - "validation/styles/**"
      - "**/styles/**"
      - "**/.mypy_cache/**"
      - "**/__pycache__/**"
      - "**/.ruff_cache/**"
      - "**/.pytest_cache/**"
      - "**/build/**"
      - "**/dist/**"
      - "**/*.egg-info/**"
      - "**/*.meta.json"  # Exclude all mypy cache metadata files
      - "**/*.pyc"        # Exclude compiled Python files
      - "docs/api-reference/openapi.yaml"  # Exclude OpenAPI spec from security scanning
    parallel_execution: true
    max_workers: 4
    timeout_seconds: 300

    checks:
      markdown_syntax:
        enabled: true

      financial_precision:
        enabled: true
        options:
          strict_mode: true

      financial_terminology:
        enabled: true

      terminology:
        enabled: true
        custom_patterns:
          - "FiveTwenty"
          - "OANDA"
          - "v20 API"
        exclude_patterns:
          - "example"
          - "placeholder"
          - "https://"

      security:
        enabled: true
        options:
          severity_filter: "high"
          check_env_vars: true
          exclude_patterns:
            - "docs/api-reference/openapi.yaml"  # OpenAPI spec with legitimate encoded data
            - "example"  # Documentation examples
            - "demo"     # Demo code
            - "tutorial" # Tutorial code
            - "YOUR_TOKEN_HERE"  # Placeholder tokens
            - "abc123"   # Example tokens

      cross_references:
        enabled: true

      python_syntax:
        enabled: true
        options:
          check_imports: true

      code_executability:
        enabled: true

      prose:
        enabled: false  # Disabled - false positives in external libraries

    quality_gates:
      max_errors: 5
      max_warnings: 100
      max_issues_per_file: 15
      min_success_rate: 90.0
      required_checks:
        - "security"
        - "financial_precision"
      fail_on_error: true
      fail_on_security_issues: true

    reporting:
      formats:
        - "console"
        - "json"
        - "html"
      output_dir: "validation_reports"
      include_passed: false
      include_file_details: true
      group_by_severity: true
      export_trends: true

  # Strict profile for release validation
  release:
    extends: "fivetwenty"
    description: "Strict validation for release candidates"

    quality_gates:
      max_errors: 0
      max_warnings: 20
      max_issues_per_file: 5
      min_success_rate: 98.0
      fail_on_error: true
      fail_on_security_issues: true

    checks:
      prose:
        enabled: true  # Enable prose checking for releases

      cross_references:
        enabled: true
        options:
          strict_mode: true

  # Fast profile for development
  dev:
    extends: "fivetwenty"
    description: "Quick validation for development workflow"
    file_patterns:
      - "docs/**/*.md"
    parallel_execution: true
    max_workers: 8

    checks:
      markdown_syntax:
        enabled: true

      financial_precision:
        enabled: true

      security:
        enabled: true
        options:
          severity_filter: "high"  # Only high-severity security issues

      # Disable some checks for faster development
      terminology:
        enabled: false

      cross_references:
        enabled: false

      python_syntax:
        enabled: false

    quality_gates:
      max_errors: 20
      max_warnings: 200
      min_success_rate: 80.0
      fail_on_error: false
      fail_on_security_issues: true

    reporting:
      formats:
        - "console"
      include_passed: true

  # Security-focused profile
  security_audit:
    description: "Security-focused validation for audit purposes"
    file_patterns:
      - "**/*.md"
      - "**/*.py"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"

    checks:
      security:
        enabled: true
        options:
          deep_scan: true
          custom_patterns:
            - "sk_[a-zA-Z0-9]+"  # Stripe keys
            - "v20-[a-zA-Z0-9]+"  # OANDA v20 tokens

      terminology:
        enabled: true
        custom_patterns:
          - "password"
          - "secret"
          - "token"
          - "key"
          - "credential"

    quality_gates:
      max_errors: 0
      max_warnings: 0
      fail_on_security_issues: true
      required_checks:
        - "security"

    reporting:
      formats:
        - "json"
        - "html"
      output_dir: "security_reports"
      include_file_details: true

  # CI/CD profile for automated builds
  ci:
    extends: "fivetwenty"
    description: "Optimized for CI/CD environments"

    parallel_execution: true
    max_workers: 2  # Conservative for CI environments
    timeout_seconds: 600  # Longer timeout for CI

    quality_gates:
      max_errors: 0
      max_warnings: 50
      min_success_rate: 95.0
      fail_on_error: true
      fail_on_security_issues: true

    reporting:
      formats:
        - "json"
        - "junit"  # JUnit format for CI integration
      output_dir: "ci_reports"
      export_trends: true