# FiveTwenty Documentation Validation Configuration - Complete Mode
#
# Complete validation including all validators for comprehensive quality assessment.
# Includes slower validators like code_executability and external_links.

# File discovery - docs directory only
file_patterns:
  - "docs/**/*.md"

exclude_patterns:
  # Version control and caches
  - "**/.git/**"
  - "**/__pycache__/**"
  - "**/.mypy_cache/**"
  - "**/.ruff_cache/**"
  - "**/.pytest_cache/**"
  - "**/.venv/**"

  # Build artifacts
  - "**/build/**"
  - "**/dist/**"
  - "**/*.egg-info/**"
  - "**/node_modules/**"

  # Validation outputs
  - "**/validation_reports/**"
  - "**/validation_old/**"

  # Exclude everything outside docs/
  - "fivetwenty/**"          # SDK source code
  - "tests/**"              # Test files
  - "examples/**"           # Example scripts
  - "docs_validation/**"    # This validation framework
  - "oanda-api-reference/**" # External API reference
  - "*.py"                  # Python files outside docs
  - "/*.md"                 # Root-level markdown files only

# Execution settings
parallel_execution: true
max_workers: 4
timeout_seconds: 30.0

# Validator configurations - Complete mode (all validators)
validators:
  # Code linting with ruff (strict mode - all rules)
  code_linting:
    enabled: true
    options:
      # Common documentation-specific rule exclusions
      ignore_rules:
        # Ignore temp file INP001 warnings (false positives)
        - "INP001"  # Missing __init__.py
        # Allow educational print statements in tutorials
        - "T201"    # Print statements
        # Relax some documentation-specific rules
        - "D100"    # Missing module docstrings (for small examples)
        - "ANN401"  # Allow Any in examples for simplicity
        # Documentation formatting exceptions
        - "W292"    # Missing newline at end of file
        - "D202"    # No blank lines after docstring
        - "COM812"  # Missing trailing commas
        - "D107"    # Missing __init__ docstrings
        - "I001"    # Import block formatting
        # Additional docstring rules for simplified examples
        - "D101"    # Missing class docstrings
        - "D102"    # Missing method docstrings
        - "D103"    # Missing function docstrings
        - "D104"    # Missing package docstrings
        - "D105"    # Missing magic method docstrings
        - "D106"    # Missing nested class docstrings
        - "D200"    # One-line docstring should fit on one line
        - "D203"    # 1 blank line required before class docstring
        - "D204"    # 1 blank line required after class docstring
        - "D205"    # 1 blank line required between summary and description
        - "D212"    # Multi-line docstring summary should start at the first line
        # Function and method annotation exceptions for examples
        - "ANN201"  # Missing return type annotation for public function
        - "ANN001"  # Missing type annotation for function argument
        - "ANN204"  # Missing return type annotation for special method __init__
        # Security and best practice exceptions for educational examples
        - "S106"    # Possible hardcoded password (examples use placeholder tokens)
        - "BLE001"  # Do not catch blind exception (educational examples)
        - "PIE790"  # Unnecessary pass statement (placeholder examples)
        # Boolean argument exceptions for configuration examples
        - "FBT001"  # Boolean-typed positional argument
        - "FBT002"  # Boolean default positional argument
        # DateTime exceptions for educational examples
        - "DTZ003"  # datetime.utcnow() used (older examples)
        - "DTZ005"  # datetime.now() without tz argument
        # Exception handling examples
        - "B904"    # Exception handling chain examples
        # Formatting preferences for documentation
        - "Q000"    # Single vs double quotes consistency
        - "G004"    # Logging f-string usage in examples
        # Code comment examples
        - "ERA001"  # Found commented-out code (intentional examples)
        # Financial precision best practices
        - "FURB157" # Decimal string literals are best practice for financial code

  # Type checking with mypy (strict mode - all type issues)
  code_typing:
    enabled: true

  # Internal link and cross-reference validation
  cross_references:
    enabled: true

  # Critical financial safety validation
  financial_precision:
    enabled: true

  # Markdown syntax and structure validation
  markdown_syntax:
    enabled: true

  # Python code syntax in documentation
  python_syntax:
    enabled: true

  # SDK API documentation completeness
  sdk_methods:
    enabled: true

  # Security scanning for exposed secrets
  security:
    enabled: true

  # Code example executability (slower)
  code_executability:
    enabled: true

  # External link validation (slower)
  external_links:
    enabled: true
