# FiveTwenty Documentation Validation Configuration
#
# This configuration is optimized for docs-only validation of the FiveTwenty trading SDK.
# All patterns and settings are focused exclusively on the docs/ directory.

# File discovery - docs directory only
file_patterns:
  - "docs/**/*.md"

exclude_patterns:
  # Version control and caches
  - "**/.git/**"
  - "**/__pycache__/**"
  - "**/.mypy_cache/**"
  - "**/.ruff_cache/**"
  - "**/.pytest_cache/**"
  - "**/.venv/**"

  # Build artifacts
  - "**/build/**"
  - "**/dist/**"
  - "**/*.egg-info/**"
  - "**/node_modules/**"

  # Validation outputs
  - "**/validation_reports/**"
  - "**/validation_old/**"

  # Exclude everything outside docs/
  - "fivetwenty/**"          # SDK source code
  - "tests/**"              # Test files
  - "examples/**"           # Example scripts
  - "docs_validation/**"    # This validation framework
  - "oanda-api-reference/**" # External API reference
  - "*.py"                  # Python files outside docs
  - "/*.md"                 # Root-level markdown files only

# Execution settings
parallel_execution: true
max_workers: 4
timeout_seconds: 30.0

# Validator configurations
validators:
  # Critical financial safety validation
  financial_precision:
    enabled: true
    options:
      strict_mode: true

  # Security scanning for exposed secrets
  security:
    enabled: true
    options:
      severity_filter: "high"

  # Markdown syntax and structure validation
  markdown_syntax:
    enabled: true

  # Python code syntax in documentation
  python_syntax:
    enabled: true

  # Internal link and cross-reference validation
  cross_references:
    enabled: true

  # SDK API documentation completeness
  sdk_methods:
    enabled: false  # Disabled for now due to many missing docs (334 issues found)

  # Code example executability (currently disabled due to high warning volume)
  code_executability:
    enabled: false

