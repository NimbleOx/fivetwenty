site_name: FiveTwenty Documentation
exclude_docs: |
  **/__pycache__/**
  **/*.pyc
site_description: Typed Python client for OANDA v20 REST API
site_author: FiveTwenty Team
site_url: https://nimbleox.github.io/fivetwenty

repo_name: NimbleOx/fivetwenty
repo_url: https://github.com/NimbleOx/fivetwenty
edit_uri: blob/main/docs/

# Suppress warnings for files that exist but aren't in nav (contributing docs, etc.)
validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    absolute_links: ignore
    unrecognized_links: ignore


theme:
  name: material
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  favicon: assets/520logo.svg
  logo: assets/520logo.svg

nav:
  - Home: index.md
  - Tutorials:
      - tutorials/index.md
      - Getting Started:
          - Installation & Setup: tutorials/getting-started/installation.md
          - Authentication Basics: tutorials/getting-started/authentication.md
          - Your First Trade: tutorials/getting-started/first-trade.md
      - Trading Basics:
          - tutorials/basic-trading/index.md
          - Foundation: tutorials/basic-trading/foundation.md
          - Market Data & Analysis: tutorials/basic-trading/market-data.md
          - Position Management: tutorials/basic-trading/position-management.md
          - Strategy Building: tutorials/basic-trading/strategy-building.md
          - Complete System: tutorials/basic-trading/complete-system.md
      - More Trading:
          - tutorials/advanced-orders/index.md
          - Stop Orders & Market-If-Touched: tutorials/advanced-orders/stop-orders-mit.md
          - Dynamic Order Management: tutorials/advanced-orders/dynamic-management.md
          - Order Strategies & Combinations: tutorials/advanced-orders/order-strategies.md
      - Risk Management: tutorials/risk-management.md
      - Account Management: tutorials/account-management.md
      - Streaming Data: tutorials/streaming-data.md

  # GUIDES - Comprehensive practical guidance
  - "Guides":
      - Overview: guides/index.md
      - Understanding & Architecture:
          - SDK Architecture: guides/understanding/sdk-architecture.md
          - Async vs Sync Design: guides/understanding/async-vs-sync.md
          - Environment Management: guides/understanding/environments.md
          - Configuration Patterns: guides/understanding/configuration.md
          - Best Practices & Patterns: guides/understanding/best-practices.md
      - Trading Concepts:
          - Forex Trading Concepts: guides/trading-concepts/forex-trading-concepts.md
          - Market Data & Streaming: guides/trading-concepts/streaming.md
          - Order Types & Strategies: guides/trading-concepts/order-types.md
      - Practical Solutions:
          - Set Up Live Trading: guides/practical-solutions/setup-live-trading.md
          - Handle Connection Failures: guides/practical-solutions/handle-connection-failures.md
          - Close Positions: guides/practical-solutions/close-positions.md
          - Manage Orders Effectively: guides/practical-solutions/manage-orders-effectively.md
          - Implement Stop-Loss Strategies: guides/practical-solutions/implement-stop-loss-strategies.md
          - Multi-Account Configuration: guides/practical-solutions/multi-account-configuration.md
      - Performance Optimization:
          - Overview: guides/optimization/index.md
          - Connection Optimization: guides/optimization/connection-optimization.md
          - Streaming Optimization: guides/optimization/streaming-optimization.md
          - Memory & CPU Optimization: guides/optimization/memory-cpu-optimization.md
          - Latency Optimization: guides/optimization/latency-optimization.md
  # REFERENCE - Information-oriented quick lookup
  - "API Reference":
      - Overview: api-reference/index.md
      - Core Components:
          - Client API: api-reference/client.md
          - Configuration: api-reference/configuration.md
          - Error Handling: api-reference/error-handling.md
          - Exceptions: api-reference/exceptions.md
      - Data Models:
          - Overview: api-reference/models/index.md
          - Account Models: api-reference/models/account-models.md
          - Trading Models: api-reference/models/trading-models.md
          - Order Models: api-reference/models/order-models.md
          - Market Data Models: api-reference/models/market-data-models.md
          - Transaction Models: api-reference/models/transaction-models.md
          - System Models: api-reference/models/system-models.md
          - Enum Models: api-reference/models/enum-models.md
      - API Endpoints:
          - Overview: api-reference/endpoints/index.md
          - Accounts: api-reference/endpoints/accounts.md
          - Instruments: api-reference/endpoints/instruments.md
          - Orders: api-reference/endpoints/orders.md
          - Trades: api-reference/endpoints/trades.md
          - Positions: api-reference/endpoints/positions.md
          - Pricing: api-reference/endpoints/pricing.md
          - Transactions: api-reference/endpoints/transactions.md
      - OANDA API Specification:
          - OpenAPI Spec: api-reference/oanda-openapi-spec.md

  # EXAMPLES - Practical demonstrations
  - Examples:
      - Overview: examples.md
      - Notebooks:
          - Quick Start: examples/notebooks/quick-start.ipynb
          - Data Analysis: examples/notebooks/data-analysis.ipynb
          - Streaming Data: examples/notebooks/streaming-data.ipynb
          - Risk Management: examples/notebooks/risk-management.ipynb
          - Trading Strategies: examples/notebooks/trading-strategies.ipynb
          - Backtesting: examples/notebooks/backtesting.ipynb

  # CONTRIBUTING - Contributor guidance
  - Contributing:
      - contributing/index.md
      - Development Setup: contributing/development-setup.md
      - Testing Guide: contributing/testing-guide.md
      - Code Style: contributing/code-style.md


markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 2
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - mkdocs-jupyter:
      include: ["*.ipynb"]
      execute: false
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              ignore_init_summary: true
            merge_init_into_class: true
            show_submodules: true

extra_css:
  - assets/custom.css

extra:
  # analytics:
  #   provider: google
  #   property: !ENV GOOGLE_ANALYTICS_KEY
  generator: false  # Remove "Made with Material for MkDocs"
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NimbleOx/fivetwenty
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/fivetwenty/

