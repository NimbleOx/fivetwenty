[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oanda"
version = "20.1.0"
description = "Simple, elegant Python client for OANDA's REST API v20"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.12.0",
    "pytest-vcr>=1.0.2",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "black>=23.11.0",
]
docs = [
    "mkdocs-material>=9.4.0",
]

[project.urls]
Homepage = "https://github.com/oanda/oanda-sdk-python"
Documentation = "https://oanda-sdk-python.readthedocs.io"
Repository = "https://github.com/oanda/oanda-sdk-python"
Issues = "https://github.com/oanda/oanda-sdk-python/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/oanda",
    "/README.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["oanda"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
    "ARG002", # unused method argument
]

[tool.ruff.per-file-ignores]
"tests/**/*" = ["ARG", "S101"]

[tool.black]
target-version = ['py310']
include = '\.pyi?$'
line-length = 88

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "mypy>=1.17.1",
]
